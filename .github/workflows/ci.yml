# Vérifications à chaque push et pull request : typage, tests, build.
# Aucun secret n'est nécessaire : les tests ne touchent pas la base et le
# build utilise des valeurs factices (toutes les pages sont dynamiques).
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://exemple.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: cle-factice-pour-le-build
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Dépendances
        run: npm ci

      - name: Typage
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
